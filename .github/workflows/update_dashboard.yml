name: Update Coupon Campaign Dashboard

on:
  schedule:
    # 06:30, 06:50 THA (23:30, 23:50 UTC วันก่อนหน้า)
    - cron: '30,50 23 * * *'
    # 07:00 - 21:59 THA (00:00 - 14:59 UTC) ทุก 20 นาที
    - cron: '*/20 0-14 * * *'
    # 22:00 THA (15:00 UTC)
    - cron: '0 15 * * *'
  repository_dispatch:
    # Trigger from external services like n8n Webhook / API
    types: [update_coupon_dashboard]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Data & Build Dashboard
        env:
          DB_HOST: ${{ secrets.DB_HOST || '203.154.83.62' }}
          DB_PORT: ${{ secrets.DB_PORT || '13306' }}
          DB_USER: ${{ secrets.DB_USER || 'powerbi' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'pBp8@24019!' }}
          DB_NAME: ${{ secrets.DB_NAME || 'MYPOS2018_CENTER' }}
          START_DATE: '2026-11-01'
          FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 'true' || 'false' }}
        run: |
          python run_alert_check.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update coupon campaign dashboard data [skip ci]"
          file_pattern: "index.html gp_anomaly_dashboard.html gp_anomaly_data.json gp_anomaly_data.js"
