name: Update Coupon Campaign Dashboard

on:
  schedule:
    # Run every 20 minutes (UTC)
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Data & Build Dashboard
        env:
          DB_HOST: ${{ secrets.DB_HOST || '203.154.83.62' }}
          DB_PORT: ${{ secrets.DB_PORT || '13306' }}
          DB_USER: ${{ secrets.DB_USER || 'powerbi' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'pBp8@24019!' }}
          DB_NAME: ${{ secrets.DB_NAME || 'MYPOS2018_CENTER' }}
          START_DATE: '2026-11-01'
        run: |
          python run_alert_check.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update coupon campaign dashboard data [skip ci]"
          file_pattern: "index.html gp_anomaly_dashboard.html gp_anomaly_data.json gp_anomaly_data.js"
